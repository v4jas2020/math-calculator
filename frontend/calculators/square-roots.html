<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title data-i18n="squareRootsPageTitle">Simplifying Square Roots - Math Calculators</title>
    <link rel="stylesheet" href="../css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>  <!--My genius brain tried to write this from memory, as you may see in the last commit it did not work. -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.111.1/mathlive.min.js"></script> <!--Same here! -->
</head>

<body>
<header>
    <div class="language-switcher">
        <button type="button" data-language="en" aria-label="English">🇬🇧</button>
        <button type="button" data-language="lt" aria-label="Lietuvių">🇱🇹</button>
    </div>
    <div class="calculator-page-title">
        <h1 data-i18n="squareRootsHeading">Simplifying Square Roots</h1>
        <span class="status-badge status--beta">BETA</span>
    </div>
    <a href="../calculators.html" data-i18n="backToCalculators">Back to calculators</a>
</header>

<hr>

<main>
    <h2 data-i18n="squareRootsEnter">Enter a square root</h2>
    <p data-i18n="squareRootsIntro">
        Simplify square roots by extracting perfect-square factors.
    </p>
    <form id="square-roots-form">
        <label for="equation" data-i18n="fractionExpression">Expression</label>
        <math-field
            id="equation"
            math-virtual-keyboard-policy="manual"
            aria-label="Square root expressions">
        </math-field>
         <div class="math-toolbar" aria-label="Math symbols">
            <button type="button" data-math="x">x</button>
            <button type="button" data-math="y">y</button>
            <button type="button" data-math="a">a</button>
            <button type="button" data-math="b">b</button>

            <button type="button" data-math="+">+</button>
            <button type="button" data-math="-">−</button>
            <button type="button" data-math="\cdot">×</button>
            <button type="button" data-math="\div">÷</button>

            <button type="button"
                     data-math="\sqrt{\placeholder{}}">
                √
            </button>

            <button type="button"
                    data-math="\left(\placeholder{}\right)">
                ( )
            </button>

            <button type="button"
                    data-math="\frac{\placeholder{}}{\placeholder{}}">
                a/b
            </button>

            <button type="button" data-math="^{2}">
                □²
            </button>
            <button type="button" data-math="^{3}">
                □³
            </button>

            <button type="button"
                    data-command="deleteBackward">
                ⌫
            </button>
        </div>
        <button type="submit" data-i18n="calculate">
            Calculate
        </button>
    </form>
    <p id="square-roots-error" role="alert"></p>
    <h3 data-i18n="examples">Examples</h3>
    <div class="square-roots-examples">
        <button type="button"
                class="square-roots-example"
                data-latex="\sqrt{72}">
            \(\sqrt{72}\)
        </button>

        <button type="button"
                class="square-roots-example"
                data-latex="\sqrt{50}">
            \(\sqrt{50}\)
        </button>

        <button type="button"
                class="square-roots-example"
                data-latex="\sqrt{144}">
            \(\sqrt{144}\) <!-- there was a missing mathJax delimiter that I did not see -->
        </button>

        <button type="button"
                class="square-roots-example"
                data-latex="\sqrt{98}">
            \(\sqrt{98}\)
        </button>

        <button type="button"
                class="square-roots-example"
                data-latex="3\sqrt{12}">
            \(3\sqrt{12}\)
        </button>

        <button type="button"
                class="square-roots-example"
                data-latex="-2\sqrt{18}">
            \(-2\sqrt{18}\)
        </button>
    </div>

   <hr>

    <section id="square-roots-result"
             aria-live="polite"
             hidden>
        <h2 data-i18n="stepByStep">
            Step-by-step solution
        </h2>
        <div id="square-roots-steps"></div>
        <h3 data-i18n="squareRootsFinalAnswer">Final Answer</h3>
        <div id="square-roots-answer"></div>
    </section>
</main>

<footer class="site-footer">
    <p data-i18n="developerCredit">
        Developed and maintained by Vėjas Kašėta. ( v4jas on github )
    </p>
    <p>
        <span data-i18n="sourceCode">Source code:</span>
        <a href="https://github.com/v4jas2020/math-calculator"
           target="_blank"
           rel="noopener noreferrer">
           Github
        </a>
        — <span data-i18n="starRepository">Make sure to star it on GitHub!</span>
    </p>
</footer>

<script src="../js/translations.js"></script>
<script src="../js/api.js"></script>
<script src="../js/render-steps.js"></script>
<script src="../js/square-roots-calculator.js"></script>
<script src="../js/math-editor.js"></script>
<script src="../js/calculator-actions.js"></script>

</body>
</html>
