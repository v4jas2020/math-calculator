        nav { display: grid; gap: 12px; margin-top: 24px; }
        .version {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 66px;
            padding: 12px;
            color: #242424;
            border: none;
            border-radius: 0;
            text-decoration: none;
            font-size: clamp(23px, 5vw, 31px);
            font-weight: 600;
            letter-spacing: -0.015em;
            transition: background .15s, border-color .15s;

        .version:hover { background: transparent; text-decoration: underline; text-underline-offset: 7px; }

        .site-footer {
            width: 100%;
            box-sizing: border-box;
            padding: 65px 20px 25px;
            border-top: 1px solid #d5d5d5;
            background: linear-gradient(
            to bottom,
            transparent 0%,
            #f0f0f0 65%,
            #e2e2e2 100%
            );
            text-align: center;
            color: #666;
